name: Build Flutter APK

on:
  push:
    branches:
      - main
      - arena/01a0c07e-body-prayer
  workflow_dispatch:

jobs:
  build:
    name: Build Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: prayer-times-luxor-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # The release keystore (android/app/app-release.jks) and the signingConfig
      # block in android/app/build.gradle are committed to the repo, so the
      # release build signs itself without needing repository secrets.
      - name: Build Release APK (signed)
        run: flutter build apk --release

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: prayer-times-luxor-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Show APK sizes
        run: ls -lh build/app/outputs/flutter-apk/
